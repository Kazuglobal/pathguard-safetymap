<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>series-20 Three.js</title>
<script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
<style>
  :root {
    --blue: #3d9bff; --gold: #ffc21a; --red: #ff3b3b; --extreme: #ff1f4f;
    --ink: #f4f6fb; --muted: #9aa6bf;
    --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "IPAPGothic", sans-serif;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); color: var(--ink); background: #04060c; }
  #gl { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #flash { background: #ff1430; opacity: 0; mix-blend-mode: screen; }
  #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%); }

  /* HUD（上220pxを避けて配置） */
  #hud { position: absolute; top: 236px; left: 64px; right: 140px; display: flex; justify-content: space-between; align-items: baseline;
         font-weight: 700; font-size: 30px; letter-spacing: .08em; color: #cfe3ff; text-shadow: 0 0 12px rgba(61,155,255,.7); }
  #hud .timer { font-variant-numeric: tabular-nums; color: #ff6b6b; text-shadow: 0 0 12px rgba(255,59,59,.8); }
  #badge { position: absolute; top: 284px; left: 64px; font-size: 24px; font-weight: 700; letter-spacing: .2em; color: var(--gold); opacity: .9; }
  #panelTitle { position: absolute; top: 340px; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 900; letter-spacing: .04em;
                text-shadow: 0 4px 24px rgba(0,0,0,.9); }

  /* フック */
  #hook { position: absolute; left: 120px; right: 120px; top: 560px; text-align: center; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
  #hook .l1, #hook .l2 { font-size: 64px; font-weight: 900; text-shadow: 0 6px 30px rgba(0,0,0,.95); }
  #hook .hi { margin: 26px 0; font-size: 92px; line-height: 1.18; text-wrap: balance; font-weight: 900; color: #fff;
              text-shadow: 0 0 28px rgba(255,40,60,.95), 0 8px 0 #8a0014; }
  #hook .ch { display: inline-block; will-change: transform, opacity; }

  /* 柱のラベル（3D座標から毎フレーム配置） */
  .bar-label { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; }
  .bar-label .rate { font-size: 54px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 4px 18px rgba(0,0,0,.95); }
  .bar-label .mult { font-size: 30px; font-weight: 900; color: #fff; background: rgba(255,40,60,.9); padding: 2px 12px; border-radius: 6px; display: inline-block; margin-top: 4px; }
  .bar-name { position: absolute; transform: translate(-50%, 0); width: 180px; text-align: center; word-break: auto-phrase; text-wrap: balance; font-size: 28px; font-weight: 700; line-height: 1.25;
              text-shadow: 0 3px 12px rgba(0,0,0,1); }
  .bar-name .rank { display: block; font-size: 26px; letter-spacing: .1em; }
  .bar-name .note { display: block; font-size: 22px; color: var(--muted); font-weight: 500; margin-top: 4px; }

  /* 倍率の大きな文字 */
  #ratio { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-weight: 900; opacity: 0; }
  #ratio .pre { font-size: 44px; text-shadow: 0 4px 20px #000; }
  #ratio .num { font-size: 210px; line-height: 1; color: #fff; text-shadow: 0 0 40px rgba(255,30,60,1), 0 12px 0 #7a0012; }

  /* 理由カード */
  #reasons { position: absolute; left: 60px; right: 140px; top: 560px; perspective: 1400px; }
  .card { position: absolute; left: 0; right: 0; padding: 34px 38px; border-radius: 22px; backdrop-filter: blur(6px);
          transform-style: preserve-3d; will-change: transform, opacity; }
  .card .t { font-size: 44px; font-weight: 900; margin-bottom: 14px; }
  .card .b { font-size: 40px; font-weight: 700; line-height: 1.4; }
  #cardL { top: 0; background: rgba(20,60,130,.72); border: 3px solid var(--blue); box-shadow: 0 0 40px rgba(61,155,255,.5); }
  #cardR { top: 330px; background: rgba(120,10,25,.75); border: 3px solid var(--red); box-shadow: 0 0 50px rgba(255,59,59,.6); }

  /* 締め・出典 */
  #cta { position: absolute; left: 60px; right: 140px; top: 760px; text-align: center; text-wrap: balance; font-size: 70px; line-height: 1.3; font-weight: 900; opacity: 0;
         text-shadow: 0 0 30px rgba(255,194,26,.8), 0 6px 0 #000; }
  #source { position: absolute; left: 64px; right: 140px; top: 1500px; text-align: center; font-size: 26px; color: #c9d2e6; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="labels"></div>
  <div id="hud"><span class="file"></span><span class="timer">00:00.0</span></div>
  <div id="badge"></div>
  <div id="panelTitle"></div>
  <div id="hook"><div class="l1"></div><div class="hi"></div><div class="l2"></div></div>
  <div id="ratio"><div class="pre"></div><div class="num"></div></div>
  <div id="reasons">
    <div class="card" id="cardL"><div class="t"></div><div class="b"></div></div>
    <div class="card" id="cardR"><div class="t"></div><div class="b"></div></div>
  </div>
  <div id="cta"></div>
  <div id="source">出典：警察庁 交通事故統計オープンデータ（2023年 本票）</div>
  <div class="layer" id="flash"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
