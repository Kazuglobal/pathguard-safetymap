name: Cloudflare Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ar-hazard-regressions:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Verify AR, selected points, official viewer and D1 contracts
        run: pnpm exec vitest run tests/unit/lib/ar-risk-data.test.ts tests/unit/hooks/use-ar-risk-data.test.tsx tests/unit/app/api/hazard-point-risks.test.ts tests/components/map/ar-inundation-overlay.test.tsx tests/components/map/accident-street-view.test.tsx tests/components/map/ar-real-risks.test.tsx tests/components/map/point-hazard-section.test.tsx tests/unit/db/hazard-repo.test.ts tests/unit/db/accidents-repo.test.ts tests/unit/lib/hazard-zone-gate-d1.test.ts tests/unit/lib/traffic-accident-heatmap.test.ts tests/components/map/accident-heatmap-layer-popup.test.tsx tests/components/map/accident-stats-overlay.test.tsx tests/components/map/ar-view-learning-tour.test.tsx tests/unit/lib/content-security-policy.test.ts tests/unit/cloudflare --maxWorkers=2
      - name: Verify isolated preview configuration
        run: node --test scripts/cloudflare/preview-config.test.mjs
      - name: Install official geometry readers
        run: python -m pip install -r scripts/migrate/requirements-hazards.txt
      - name: Verify additive official hazard preparation and resume guards offline
        run: python -m unittest discover -s tests/scripts -p test_official_hazards.py

  accident-regressions:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline geometry readers
        run: python -m pip install -r scripts/accidents/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Verify published ranking snapshots
        run: pnpm exec vitest run tests/unit/lib/accident-rankings.test.ts --maxWorkers=1
      - name: Verify offline assignment and count reconciliation
        run: python -m unittest discover -s tests/scripts -p 'test_accident*.py'
      - name: Verify immutable preview import guards
        run: python -m unittest discover -s tests/scripts -p 'test_verified*stage.py'

  report-image-regressions:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check application types
        run: pnpm exec tsc --noEmit --incremental false
      - name: Verify analysis, uploads, previews and sharing
        run: pnpm exec vitest run tests/unit/lib/claude-vision.test.ts tests/unit/lib/claude-vision-transport.test.ts tests/unit/app/api/vlm-analyze-hazard.test.ts tests/unit/hooks/use-danger-report-submit-images.test.tsx tests/unit/lib/report-generation/family-share-card.test.ts tests/components/danger-report/submitted-report-preview.test.tsx tests/components/danger-report/vlm-analysis-panel.test.tsx tests/unit/lib/vlm-analysis.test.ts tests/unit/lib/gemini-prompts.test.ts tests/components/report-page.test.tsx tests/components/route-manager-share.test.tsx tests/unit/app/api/image-process-auth-and-type.test.ts --maxWorkers=1

  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    timeout-minutes: 45
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PREVIEW_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_BASE_URL }}
      NEXT_PUBLIC_SITE_URL: https://pathguardian-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
      RATE_LIMIT_NAMESPACE: preview:pr-${{ github.event.pull_request.number }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.PREVIEW_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.PREVIEW_UPSTASH_REDIS_REST_TOKEN }}
      CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check preview configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in the cloudflare-preview environment'; exit 1; }
          node --test scripts/cloudflare/preview-config.test.mjs
      - name: Build and deploy isolated preview Workers
        id: deploy
        run: pnpm deploy:cloudflare-preview -- --preview=pr-${{ github.event.pull_request.number }}
      - name: Inspect traffic database capacity without modifying data
        run: |
          mkdir -p artifacts/d1-capacity
          pnpm exec wrangler d1 info pathguardian-traffic --config wrangler.server.jsonc --json > artifacts/d1-capacity/production.json
          pnpm exec wrangler d1 info pathguardian-traffic-preview --config wrangler.preview-resources.json --json > artifacts/d1-capacity/preview.json
      - name: Preserve read-only D1 capacity evidence
        uses: actions/upload-artifact@v4
        with:
          name: accident-d1-capacity-${{ github.run_id }}
          path: artifacts/d1-capacity/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Add preview link to pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- pathguardian-cloudflare-preview -->'
            const body = `${marker}\n## Cloudflare Preview\n\n[プレビューを開く](${process.env.PREVIEW_URL})\n\nCommit: \`${context.sha.slice(0, 7)}\``
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    timeout-minutes: 10
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete isolated preview Workers
        run: pnpm delete:cloudflare-preview -- --preview=pr-${{ github.event.pull_request.number }}
