#
# SAFE MAGAZINE の画像（サムネイル・本文図解）を生成してブランチへ積む。
#
# 週次ルーチン（.claude/commands/safe-magazine-update.md）は記事本文と
# scripts/generate-safe-magazine-images.ts の ARTICLE_IMAGES に「プロンプト」だけを書き、
# 画像ファイルそのものはこのワークフローが作る。
# クラウド実行のセッションには GEMINI_API_KEY が無いため、生成はここに一本化する。
# （通学路ニュース側の School Route News Images と同じ考え方の、SAFE MAGAZINE 版）
#
# 生成対象（scripts/generate-safe-magazine-images.ts が担当する）:
#   - サムネイル   /images/safe-magazine/thumbnails/{slug}.jpg
#   - 本文図解     /images/safe-magazine/articles/{slug}/{image-id}.jpg
#
# 生成元は ARTICLE_IMAGES であって lib/safe-magazine.ts の ARTICLES ではない。
# つまり ARTICLES への登録（公開統合）より前に画像を用意できる。
# tests/unit/lib/safe-magazine-release-readiness.test.ts は ARTICLES の全記事について
# サムネイルの実ファイル存在を検証するため、「画像生成 → 登録」の順を守れば
# 読み込み準備テストが赤くなる期間が生じない。
#
# 既存ファイルはスクリプト側でスキップされるので、足りない分だけが生成される。
# すべて作り直したい場合だけ、workflow_dispatch の force を true にする。
#
# 注意: 既定の GITHUB_TOKEN による push では、GitHub の仕様により他の
# ワークフロー（Cloudflare Preview 等）が再実行されない。これはこのワーク
# フロー自身の無限ループを防ぐ仕組みでもあるが、画像コミットが PR の
# 先頭になると、その commit には CI の結果が付かない状態になる。
#
# 自動で CI を回し直したい場合は、repo スコープの PAT を
# NEWS_IMAGES_PUSH_TOKEN として登録する（通学路ニュース側と同じシークレットを使う）。
# 登録されていればそちらで push し、通常どおり他のワークフローが起動する。
# ループ防止は paths フィルタが担う（このワークフローは public/images/** の変更では起動しない）。
# 未登録なら GITHUB_TOKEN で push し、CI は次の push まで付かない。
#
name: Safe Magazine Images

on:
  push:
    branches:
      - 'feat/safe-magazine-**'
      - 'chore/safe-magazine-**'
    paths:
      - 'scripts/generate-safe-magazine-images.ts'
      - 'lib/safe-magazine.ts'
      - '.github/workflows/safe-magazine-images.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '既存の画像も作り直す（--force・API 呼び出しが全記事分に増えるので通常は false）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 生成の途中で打ち切ると API 呼び出しが無駄になるため、割り込みでは止めない
  group: safe-magazine-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # push では detached HEAD になるため、押し戻せるようブランチとして取得する
          ref: ${{ github.ref_name }}
          # PAT があればそれで push する（ヘッダの注意を参照）。無ければ GITHUB_TOKEN。
          token: ${{ secrets.NEWS_IMAGES_PUSH_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check that the image API key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY (repository secret) が未設定のため画像を生成できません。" \
                 "Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
          echo "GEMINI_API_KEY は設定されています（値は出力しません）。"

      - name: List the images that are still missing
        run: |
          node --input-type=module -e '
            import fs from "node:fs"
            const source = fs.readFileSync("scripts/generate-safe-magazine-images.ts", "utf8")
            const slugs = [...source.matchAll(/articleSlug: "([^"]+)"/g)].map((m) => m[1])
            const missing = slugs.filter(
              (slug) => !fs.existsSync(`public/images/safe-magazine/thumbnails/${slug}.jpg`),
            )
            console.log(`ARTICLE_IMAGES の記事数: ${slugs.length}`)
            console.log(
              missing.length
                ? `サムネイルが未生成の記事 (${missing.length}件):\n  ${missing.join("\n  ")}`
                : "サムネイルはすべて揃っています。",
            )
          '

      - name: Generate the missing images
        id: generate
        # 一部が安全フィルタで弾かれても、成功した分は push して残す
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            npx tsx scripts/generate-safe-magazine-images.ts --force
          else
            npx tsx scripts/generate-safe-magazine-images.ts
          fi

      - name: Commit the generated images
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/images/safe-magazine
          if git diff --cached --quiet; then
            echo "変更なし（画像はすべて揃っている）。"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit \
            -m 'chore(safe-magazine): SAFE MAGAZINE の画像を生成して追加' \
            -m 'Safe Magazine Images ワークフローによる自動生成。'
          # 生成中に人の push が入っていた場合に備えて、取り込んでから押し戻す
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Verify every configured article now has a thumbnail
        # ARTICLE_IMAGES に設定のある記事すべてについて、サムネイルの実ファイルを確かめる。
        # 本文図解の網羅は、公開統合（ARTICLES への登録）後に
        # tests/unit/lib/safe-magazine-release-readiness.test.ts が検証する。
        run: |
          node --input-type=module -e '
            import fs from "node:fs"
            const source = fs.readFileSync("scripts/generate-safe-magazine-images.ts", "utf8")
            const slugs = [...source.matchAll(/articleSlug: "([^"]+)"/g)].map((m) => m[1])
            if (!slugs.length) {
              console.error("::error::ARTICLE_IMAGES から記事を読み取れませんでした。")
              process.exit(1)
            }
            const missing = slugs.filter(
              (slug) => !fs.existsSync(`public/images/safe-magazine/thumbnails/${slug}.jpg`),
            )
            if (missing.length) {
              console.error(
                `::error::サムネイルを生成できなかった記事が ${missing.length} 件あります: ${missing.join(", ")}`,
              )
              process.exit(1)
            }
            console.log(`サムネイル ${slugs.length} 件すべてが存在します。`)
          '

      - name: Check the committed images against the readiness test
        # 画像に関する2項目だけを対象にする（最新5件の期待値など、画像と無関係な
        # 理由でこのワークフローが赤くならないようにするため）。
        # --testTimeout は画像を全件読む検証が既定5秒で落ちるのを避けるため。
        run: |
          pnpm exec vitest run tests/unit/lib/safe-magazine-release-readiness.test.ts \
            -t 'generated thumbnail' --testTimeout=120000
          pnpm exec vitest run tests/unit/lib/safe-magazine-release-readiness.test.ts \
            -t 'binary format' --testTimeout=120000

      - name: Summary
        if: always()
        run: |
          {
            echo '## Safe Magazine Images'
            echo ''
            echo "- 画像の生成: \`${{ steps.generate.outcome }}\`"
            echo "- ブランチへの push: \`${{ steps.commit.outputs.pushed || 'false' }}\`"
            if [ '${{ steps.commit.outputs.pushed }}' = 'true' ]; then
              echo '- このワークフローの push では他の CI は再実行されません。プレビューに反映するには PR へ別の push を行ってください。'
              echo '- 画像が揃ったら、各号の `content/safe-magazine/research/*-registration-snippet.md` を使って `lib/safe-magazine.ts` の `ARTICLES` へ登録してください。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any image could not be generated
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::一部の画像を生成できませんでした。上のログで失敗した記事を確認し、" \
               "安全フィルタに弾かれたものは scripts/generate-safe-magazine-images.ts の" \
               "該当プロンプトを修正してから再実行してください。"
          exit 1
